rules:
  # ──────────────────────────────────────────────
  # XSS Scanner (FG-XSS-001 — FG-XSS-008)
  # ──────────────────────────────────────────────

  - id: FG-XSS-001
    name: no-inner-html
    title: Unsafe innerHTML Assignment
    category: xss
    severity: high
    cwe: CWE-79
    owasp: "A03:2021 - Injection"
    description: "Direct innerHTML assignment can lead to XSS if the value contains unsanitized user input."
    remediation: "Use textContent or innerText for plain text. If HTML is required, sanitize with DOMPurify or a similar library."

  - id: FG-XSS-002
    name: no-eval
    title: Use of eval() or Similar Dynamic Code Execution
    category: xss
    severity: critical
    cwe: CWE-95
    owasp: "A03:2021 - Injection"
    description: "eval(), new Function(), and setTimeout/setInterval with string arguments execute arbitrary code and can lead to code injection."
    remediation: "Avoid eval() and new Function(). Use JSON.parse() for data, and pass function references to setTimeout/setInterval instead of strings."

  - id: FG-XSS-003
    name: no-document-write
    title: Use of document.write() or document.writeln()
    category: xss
    severity: high
    cwe: CWE-79
    owasp: "A03:2021 - Injection"
    description: "document.write() and document.writeln() inject raw HTML into the page and are a common XSS vector."
    remediation: "Use DOM manipulation methods like createElement and appendChild, or use a framework rendering system."

  - id: FG-XSS-004
    name: no-dangerous-set-inner-html
    title: React dangerouslySetInnerHTML Usage
    category: xss
    severity: high
    cwe: CWE-79
    owasp: "A03:2021 - Injection"
    description: "dangerouslySetInnerHTML bypasses React DOM escaping and can introduce XSS vulnerabilities if the HTML is not properly sanitized."
    remediation: "Avoid dangerouslySetInnerHTML. If raw HTML rendering is unavoidable, sanitize with DOMPurify before passing to __html."

  - id: FG-XSS-005
    name: no-v-html
    title: Vue v-html Directive Usage
    category: xss
    severity: high
    cwe: CWE-79
    owasp: "A03:2021 - Injection"
    description: "The v-html directive renders raw HTML and can lead to XSS if bound to unsanitized user input."
    remediation: "Use text interpolation {{ }} instead of v-html. If raw HTML is required, sanitize it with DOMPurify before binding."

  - id: FG-XSS-006
    name: no-bypass-security
    title: Angular Security Bypass (bypassSecurityTrust*)
    category: xss
    severity: critical
    cwe: CWE-79
    owasp: "A03:2021 - Injection"
    description: "Angular DomSanitizer bypass methods disable built-in XSS protection and should only be used with fully trusted content."
    remediation: "Avoid bypassSecurityTrust* methods. Let Angular sanitize values automatically, or use a custom Pipe with DOMPurify for controlled sanitization."

  - id: FG-XSS-007
    name: no-outer-html
    title: Unsafe outerHTML Assignment
    category: xss
    severity: high
    cwe: CWE-79
    owasp: "A03:2021 - Injection"
    description: "Direct outerHTML assignment replaces the element and its contents with raw HTML, enabling XSS if the value is unsanitized."
    remediation: "Use DOM APIs (createElement, replaceWith) for structural changes. If HTML is required, sanitize with DOMPurify."

  - id: FG-XSS-008
    name: no-unsafe-url-scheme
    title: "Unsafe javascript: URL Scheme"
    category: xss
    severity: medium
    cwe: CWE-79
    owasp: "A03:2021 - Injection"
    description: "javascript: URLs execute code when navigated to and are a common XSS vector in href, src, and other URL attributes."
    remediation: "Never use javascript: URLs. Use event handlers for interactivity and validate/sanitize all user-provided URLs against an allowlist of safe schemes (https:, mailto:)."

  # ──────────────────────────────────────────────
  # Secrets Scanner (FG-SEC-001 — FG-SEC-006)
  # ──────────────────────────────────────────────

  - id: FG-SEC-001
    name: aws-credentials-exposed
    title: AWS Credentials Exposed
    category: secrets
    severity: critical
    cwe: CWE-798
    owasp: "A07:2021"
    description: "AWS access keys or secret keys found in source code. These credentials grant direct access to AWS services and can lead to full account compromise."
    remediation: "Remove the credentials from source code immediately, rotate the exposed keys in the AWS console, and use environment variables or a secrets manager (e.g. AWS Secrets Manager, SSM Parameter Store) instead."

  - id: FG-SEC-002
    name: api-key-exposed
    title: API Key or Token Exposed
    category: secrets
    severity: high
    cwe: CWE-798
    owasp: "A07:2021"
    description: "A known provider API key or authentication token was found hardcoded in source code."
    remediation: "Remove the key from source code, rotate it on the provider dashboard, and load it from environment variables or a secrets manager at runtime."

  - id: FG-SEC-003
    name: private-key-exposed
    title: Private Key Exposed
    category: secrets
    severity: critical
    cwe: CWE-321
    owasp: "A02:2021"
    description: "A private cryptographic key (RSA, EC, DSA, PGP, or OpenSSH) was found in source code. Private keys must never be committed to a repository."
    remediation: "Remove the private key from version control, revoke and regenerate it, and store it in a secure vault or file system with restricted permissions."

  - id: FG-SEC-004
    name: hardcoded-jwt
    title: Hardcoded JWT Token
    category: secrets
    severity: high
    cwe: CWE-798
    owasp: "A07:2021"
    description: "A JSON Web Token was found hardcoded in source code. JWTs often carry identity and authorization claims and should not be embedded in code."
    remediation: "Remove the JWT from source code. Tokens should be obtained at runtime via an authentication flow and stored securely (e.g. httpOnly cookies, secure session)."

  - id: FG-SEC-005
    name: database-connection-string-exposed
    title: Database Connection String Exposed
    category: secrets
    severity: critical
    cwe: CWE-798
    owasp: "A07:2021"
    description: "A database connection string containing credentials was found in source code. This exposes the database host, username, and password."
    remediation: "Remove the connection string from source code, rotate the database password, and provide it via environment variables or a secrets manager."

  - id: FG-SEC-006
    name: high-entropy-string
    title: High-Entropy String Detected
    category: secrets
    severity: medium
    cwe: CWE-798
    owasp: "A07:2021"
    description: "A high-entropy string resembling a secret or token was found. While this could be a false positive, high-entropy strings in source code often indicate leaked credentials."
    remediation: "Verify whether the flagged string is a credential. If so, remove it from source code and store it securely using environment variables or a secrets manager."

  # ──────────────────────────────────────────────
  # Dependency Scanner (FG-DEP-001 — FG-DEP-002)
  # ──────────────────────────────────────────────

  - id: FG-DEP-001
    name: known-vulnerability
    title: Known Vulnerability in Dependency
    category: dependencies
    severity: high
    cwe: CWE-1395
    description: "A dependency has a known security vulnerability reported in the OSV database."
    remediation: "Update the affected package to a patched version. Check the advisory for specific remediation steps."

  - id: FG-DEP-002
    name: outdated-critical-dependency
    title: Outdated Critical Dependency
    category: dependencies
    severity: medium
    description: "A dependency with known vulnerabilities is using an outdated version that may lack security fixes."
    remediation: "Run `npm update` or `npm install <package>@latest` to update to the latest version."

  # ──────────────────────────────────────────────
  # Auth Patterns Scanner (FG-AUTH-001 — FG-AUTH-003)
  # ──────────────────────────────────────────────

  - id: FG-AUTH-001
    name: no-localstorage-token
    title: Token Stored in Web Storage
    category: auth-patterns
    severity: high
    cwe: CWE-922
    owasp: "A02:2021"
    description: "Storing authentication tokens in localStorage or sessionStorage exposes them to XSS attacks. Any script running on the page can read these values."
    remediation: "Use httpOnly cookies for storing authentication tokens. If client-side access is needed, consider in-memory storage with short-lived tokens."

  - id: FG-AUTH-002
    name: no-token-in-url
    title: Token Passed in URL
    category: auth-patterns
    severity: high
    cwe: CWE-598
    owasp: "A02:2021"
    description: "Passing authentication tokens or API keys in URL query parameters exposes them in browser history, server logs, and referrer headers."
    remediation: "Send tokens in the Authorization header or request body instead of URL query parameters."

  - id: FG-AUTH-003
    name: no-hardcoded-credentials
    title: Hardcoded Credentials
    category: auth-patterns
    severity: critical
    cwe: CWE-798
    owasp: "A07:2021"
    description: "Hardcoded passwords, secrets, or credentials in source code can be easily extracted and lead to unauthorized access."
    remediation: "Remove hardcoded credentials and use environment variables or a secrets manager instead."

  # ──────────────────────────────────────────────
  # Misconfig Scanner (FG-CFG-001 — FG-CFG-003)
  # ──────────────────────────────────────────────

  - id: FG-CFG-001
    name: sourcemap-exposed
    title: Source Map Exposed in Production
    category: misconfig
    severity: medium
    cwe: CWE-540
    description: "Source maps expose original source code, making it easier for attackers to find vulnerabilities in your application."
    remediation: "Disable source maps in production builds. Set devtool to false or \"hidden-source-map\" in webpack, and sourceMap to false in build configs."

  - id: FG-CFG-002
    name: mixed-content
    title: Mixed Content (HTTP in HTTPS Context)
    category: misconfig
    severity: medium
    cwe: CWE-311
    description: "Loading resources over HTTP on an HTTPS page creates mixed content, allowing man-in-the-middle attacks on those resources."
    remediation: "Use HTTPS URLs for all external resources, or use protocol-relative URLs (//) when appropriate."

  - id: FG-CFG-003
    name: insecure-cdn
    title: CDN Resource Without Integrity Check
    category: misconfig
    severity: low
    cwe: CWE-353
    description: "External script or stylesheet loaded from a CDN without a Subresource Integrity (SRI) attribute. If the CDN is compromised, malicious code could be injected."
    remediation: "Add an integrity attribute with a valid hash and a crossorigin=\"anonymous\" attribute to all external script and link tags."
