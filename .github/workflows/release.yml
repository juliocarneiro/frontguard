name: Release

# Changesets opens a "Version Packages" PR from pending changesets; merging it publishes to npm.
# Publishing uses npm trusted publishing (OIDC). npm only allows configuring it on packages that
# already exist, so the first release uses the NPM_TOKEN repository secret (an npm automation
# token). After that, enable trusted publishing for both packages on npmjs.com (Settings ->
# Trusted publishing -> GitHub Actions, workflow: release.yml) and delete the secret.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 'chore: release'
          commit: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
