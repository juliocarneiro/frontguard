name: Release

# Changesets opens a "Version Packages" PR from pending changesets; merging it publishes to npm.
# Publishing uses npm trusted publishing (OIDC), so no long-lived token is stored. Configure it once
# per package on npmjs.com (Settings -> Trusted publishing -> GitHub Actions, workflow: release.yml).

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 'chore: release'
          commit: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
