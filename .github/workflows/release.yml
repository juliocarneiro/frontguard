name: Release

# Changesets opens a "chore: release" PR from pending changesets; merging it publishes to npm,
# then pushes the git tags and creates the GitHub releases.
#
# Publishing uses npm trusted publishing (OIDC + automatic provenance), configured per package
# on npmjs.com (Settings -> Trusted publishing -> GitHub Actions, repository
# juliocarneiro/frontguard, workflow release.yml). No npm token is needed: scripts/publish.ts
# publishes with the npm CLI, because pnpm publish does not do the OIDC exchange.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      # v2 is the release line compatible with @changesets/cli 3 (v1 cannot parse its output,
      # so it skipped tags and GitHub releases).
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
          pr-title: 'chore: release'
          commit-message: 'chore: release'
          create-github-releases: true
