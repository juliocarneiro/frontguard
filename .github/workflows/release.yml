name: Release

# Changesets opens a "chore: release" PR from pending changesets; merging it publishes to npm,
# then pushes the git tags and creates the GitHub releases.
#
# Publishing uses npm trusted publishing (OIDC + automatic provenance): configure it once per
# package on npmjs.com (Settings -> Trusted publishing -> GitHub Actions, repository
# juliocarneiro/frontguard, workflow release.yml). The NPM_TOKEN secret is only a fallback for
# packages without a trusted publisher; once both are configured, delete it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      # v2 is the release line compatible with @changesets/cli 3 (v1 cannot parse its output,
      # so it skipped tags and GitHub releases).
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
          pr-title: 'chore: release'
          commit-message: 'chore: release'
          create-github-releases: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
